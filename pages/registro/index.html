<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | SkillUp</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/pages/modules.css"></head><body><div id="site-header"></div><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><section class="module-panel"><span class="badge text-bg-light">ÚNETE A SKILLUP</span><h1 class="display-6 fw-bold mt-3">Crea tu cuenta</h1><p>Regístrate para encontrar tutores, guardar recursos y gestionar tus tutorías.</p><form id="register-form" class="row g-3"><div class="col-md-6"><label class="form-label" for="nombre-registro">Nombre</label><input class="form-control" id="nombre-registro" autocomplete="given-name" required></div><div class="col-md-6"><label class="form-label" for="apellido-registro">Apellido</label><input class="form-control" id="apellido-registro" autocomplete="family-name" required></div><div class="col-12"><label class="form-label" for="email-registro">Correo electrónico</label><input class="form-control" type="email" id="email-registro" autocomplete="email" required></div><div class="col-md-6"><label class="form-label" for="password-registro">Contraseña</label><input class="form-control" type="password" id="password-registro" minlength="8" autocomplete="new-password" required></div><div class="col-md-6"><label class="form-label" for="confirmar-password">Confirmar contraseña</label><input class="form-control" type="password" id="confirmar-password" minlength="8" autocomplete="new-password" required></div><div class="col-12"><label class="form-label" for="tipo-usuario">Quiero registrarme como</label><select class="form-select" id="tipo-usuario" required><option value="estudiante">Estudiante</option><option value="tutor">Tutor</option></select></div><div class="col-12"><button class="btn btn-skillup w-100" type="submit">Crear cuenta</button><p class="form-feedback mt-3" aria-live="polite"></p><p class="small text-secondary">Prototipo de interfaz: la creación de cuentas requiere conectar autenticación y backend.</p></div></form><p class="mt-3">¿Ya tienes cuenta? <a data-route="iniciar-sesion" href="#">Inicia sesión</a></p></section></div></div></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../../js/app.js"></script></body></html>
