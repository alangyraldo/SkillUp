<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agendar tutoría | SkillUp</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/components/footer.css"><link rel="stylesheet" href="../../css/pages/modules.css"></head><body><div id="site-header"></div><main class="module-page container py-5"><header class="module-heading text-center mb-5"><span class="badge text-bg-light">SKILLUP</span><h1 class="display-5 fw-bold mt-3">Agenda tu próxima tutoría</h1><p class="lead">Cuéntanos qué necesitas aprender y qué horario te funciona.</p></header><section class="module-panel"><form class="row g-3" id="booking-form"><div class="col-md-6"><label class="form-label" for="booking-name">Nombre</label><input class="form-control" id="booking-name" required></div><div class="col-md-6"><label class="form-label" for="booking-email">Correo electrónico</label><input class="form-control" type="email" id="booking-email" required></div><div class="col-md-6"><label class="form-label" for="booking-subject">Materia o tema</label><input class="form-control" id="booking-subject" required placeholder="Ej. Java, inglés..."></div><div class="col-md-6"><label class="form-label" for="booking-mode">Modalidad</label><select class="form-select" id="booking-mode"><option>Virtual</option><option>Presencial</option></select></div><div class="col-md-6"><label class="form-label" for="booking-date">Fecha preferida</label><input class="form-control" type="date" id="booking-date" required></div><div class="col-md-6"><label class="form-label" for="booking-time">Hora preferida</label><input class="form-control" type="time" id="booking-time" required></div><div class="col-12"><butto
