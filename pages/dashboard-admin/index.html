<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard del Proyecto</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="./dashboard-admin.css">
    <link rel="stylesheet" href="/pages/dashboard-admin/formulario-nueva-tutoria/formulario-nueva-tutoria.css">
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com"></script>
</head>

<body>

    <!-- CONTENEDOR GENERAL -->
    <div class="pantalla-dashboard">

        <!-- BARRA LATERAL IZQUIERDA -->
        <aside class="barra-lateral">
            <div class="barra-superior-logo">
                <div class="bloque-logo">
                    <img src="/assets/skillup_logo_blanco.png" alt="Logo" class="imagen-logo">
                    <i data-lucide="layout-dashboard" class="icono-logo"></i>
                </div>

                <!-- Menú de enlaces principales -->
                <nav class="menu-navegacion">
                    <a href="#" class="enlace-menu activo">
                        <i data-lucide="home"></i> Dashboard
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="users"></i> Usuarios
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="bar-chart-3"></i> Tutores
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="settings"></i> Recursos
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="settings"></i> Configuración
                    </a>
                </nav>
            </div>

            <!-- Botón para salir -->
            <button class="boton-salir" id="btn-cerrar-sesion">
                <i data-lucide="log-out"></i> Cerrar Sesión
            </button>
        </aside>

        <!-- CONTENIDO DERECHO -->
        <div class="contenido-principal">

            <!-- Barra Superior del Perfil -->
            <header class="barra-perfil">
                <h1 class="titulo-pagina">Panel de Control</h1>
                <div class="bloque-usuario">
                    <span class="nombre-usuario">Bienvenido, Usuario</span>
                    <div class="avatar-usuario">U</div>
                </div>
            </header>

            <!-- Zona de Paneles -->
            <main class="zona-paneles">

                <!-- RECUADROS DE MÉTRICAS -->
                <section class="contenedor-tarjetas">
                    <!-- Tarjeta 1 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Total Usuarios</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="users"></i>
                        </div>
                    </div>

                    <!-- Tarjeta 2 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Tutores</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="dollar-sign"></i>
                        </div>
                    </div>

                    <!-- Tarjeta 3 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Tutores</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="dollar-sign"></i>
                        </div>
                    </div>

                    <!-- Tarjeta 4 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Tutorías</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="clock"></i>
                        </div>
                    </div>
                </section>

                <!-- LISTA DE TUTORES (REEMPLAZO DE LA TABLA TRADICIONAL) -->
                <section class="contenedor-lista-tutores">

                    <!-- Encabezado de la Sección con el Botón Requerido -->
                    <div class="encabezado-seccion">
                        <h2>Tutores Agregados</h2>
                        <button class="btn-nueva-tutoria" id="boton-nueva-tutoria">
                            <i data-lucide="plus"></i> Nueva tutoría
                        </button>
                    </div>

                    <!-- TABLA SIMPLIFICADA CON DIVS -->
                    <div class="tabla-falsa">

                        <!-- 1. Fila de Títulos Independientes -->
                        <div class="fila-tabla encabezado-tabla">
                            <div class="columna">Título</div>
                            <div class="columna">Tutor</div>
                            <div class="columna">Categoría</div>
                            <div class="columna">Precio</div>
                            <div class="columna">Estado</div>
                            <div class="columna">Acciones</div>
                        </div>

                            <div id="listaTutorias" class="lista-tutorias">
                                <!-- Las tutorías aparecerán aquí -->
                            </div>


                    </div>

                    <!-- Fin tabla falsa -->

                </section>

            </main>
        </div>

    </div>

      <!-- Ventana emergente -->
  <div id="modal" class="modal oculto">
    <div class="modal-contenido">
      <div class="modal-header">
        <div>
          <h2>Nueva tutoría</h2>
          <p>Completa la información de la tutoría.</p>
        </div>
        <button id="cerrarModal" class="btn-cerrar" aria-label="Cerrar ventana">&times;</button>
      </div>

      <form id="formTutorias">
        <div class="campo">
          <label for="titulo">Título de la tutoría *</label>
          <input type="text" id="titulo" placeholder="Ej. Matemáticas básicas" required>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="materia">Materia *</label>
            <select id="materia" required>
              <option value="">Seleccionar materia</option>
            </select>
          </div>

          <div class="campo">
            <label for="tutor">Nombre del tutor *</label>
            <select id="tutor" required disabled>
              <option value="">Selecciona una materia primero</option>
            </select>
          </div>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="nivel">Nivel del tutor *</label>
            <select id="nivel" required disabled>
              <option value="">Selecciona un tutor primero</option>
            </select>
          </div>

          <div class="campo">
            <label for="dia">Día de la clase *</label>
            <select id="dia" required disabled>
              <option value="">Selecciona un tutor primero</option>
            </select>
          </div>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="hora">Hora de inicio *</label>
            <select id="hora" required disabled>
              <option value="">Selecciona un día primero</option>
            </select>
          </div>

          <div class="campo">
            <label for="modalidad">Modalidad *</label>
            <select id="modalidad" required disabled>
              <option value="">Selecciona un tutor primero</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <label for="descripcion">Descripción *</label>
          <textarea id="descripcion" rows="3" placeholder="Describe los temas de la tutoría..." required></textarea>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="duracion">Duración *</label>
            <select id="duracion" required>
              <option value="30">30 minutos</option>
              <option value="60" selected>1 hora</option>
              <option value="120">2 horas</option>
              <option value="180">3 horas</option>
              <option value="240">4 horas</option>
              <option value="300">5 horas</option>
              <option value="360">6 horas</option>
              <option value="420">7 horas</option>
              <option value="480">8 horas</option>
            </select>
          </div>

          <div class="campo">
            <label for="precio">Precio por sesión (COP) *</label>
            <input type="number" id="precio" min="0" step="100" placeholder="30000" required>
          </div>
        </div>

        <div class="campo">
          <label for="cupos">Cupos disponibles *</label>
          <input type="number" id="cupos" min="1" step="1" value="1" required>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelar" class="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-guardar">
            Guardar tutoría
          </button>
        </div>
      </form>
    </div>
  </div> <!--cierre ventana emergente-->









  <script src="/js/tutores.js"></script>
  <script src="/pages/dashboard-admin/formulario-nueva-tutoria/formulario-nueva-tutoria.js"></script>
    <!-- Inicializador de Iconos -->
    
    <script src="https://unpkg.com">
        lucide.createIcons();
    </script>
    <script src="../../js/auth.js"></script> 
    <script src="./dashboard-admin.js"></script>

</body>

</html>
