<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard del Proyecto</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="./dashboard-admin.css">
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com"></script>
</head>

<body>

    <!-- CONTENEDOR GENERAL -->
    <div class="pantalla-dashboard">

        <!-- BARRA LATERAL IZQUIERDA -->
        <aside class="barra-lateral">
            <div class="barra-superior-logo">
                <div class="bloque-logo">
                    <img src="/assets/skillup_logo_blanco.png" alt="Logo" class="imagen-logo">
                    <i data-lucide="layout-dashboard" class="icono-logo"></i>
                </div>

                <!-- Menú de enlaces principales -->
                <nav class="menu-navegacion">
                    <a href="#" class="enlace-menu activo">
                        <i data-lucide="home"></i> Dashboard
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="users"></i> Usuarios
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="bar-chart-3"></i> Tutores
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="settings"></i> Recursos
                    </a>
                    <a href="#" class="enlace-menu">
                        <i data-lucide="settings"></i> Configuración
                    </a>
                </nav>
            </div>

            <!-- Botón para salir -->
            <button class="boton-salir" id="btn-cerrar-sesion">
                <i data-lucide="log-out"></i> Cerrar Sesión
            </button>
        </aside>

        <!-- CONTENIDO DERECHO -->
        <div class="contenido-principal">

            <!-- Barra Superior del Perfil -->
            <header class="barra-perfil">
                <h1 class="titulo-pagina">Panel de Control</h1>
                <div class="bloque-usuario">
                    <span class="nombre-usuario">Bienvenido, Usuario</span>
                    <div class="avatar-usuario">U</div>
                </div>
            </header>

            <!-- Zona de Paneles -->
            <main class="zona-paneles">

                <!-- RECUADROS DE MÉTRICAS -->
                <section class="contenedor-tarjetas">
                    <!-- Tarjeta 1 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Total Usuarios</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="users"></i>
                        </div>
                    </div>

                    <!-- Tarjeta 2 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Tutores</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="dollar-sign"></i>
                        </div>
                    </div>

                    <!-- Tarjeta 3 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Tutores</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="dollar-sign"></i>
                        </div>
                    </div>

                    <!-- Tarjeta 4 -->
                    <div class="tarjeta-metrica">
                        <div class="info-tarjeta">
                            <p class="etiqueta-tarjeta">Tutorías</p>
                            <h3 class="valor-tarjeta">0</h3>
                        </div>
                        <div class="circulo-icono">
                            <i data-lucide="clock"></i>
                        </div>
                    </div>
                </section>

                <!-- LISTA DE TUTORES (REEMPLAZO DE LA TABLA TRADICIONAL) -->
                <section class="contenedor-lista-tutores">

                    <!-- Encabezado de la Sección con el Botón Requerido -->
                    <div class="encabezado-seccion">
                        <h2>Tutores Agregados</h2>
                        <button class="btn-nueva-tutoria" id="boton-nueva-tutoria">
                            <i data-lucide="plus"></i> Nueva tutoría
                        </button>
                    </div>

                    <!-- TABLA SIMPLIFICADA CON DIVS -->
                    <div class="tabla-falsa">

                        <!-- 1. Fila de Títulos Independientes -->
                        <div class="fila-tabla encabezado-tabla">
                            <div class="columna">Título</div>
                            <div class="columna">Tutor</div>
                            <div class="columna">Categoría</div>
                            <div class="columna">Precio</div>
                            <div class="columna">Estado</div>
                            <div class="columna">Acciones</div>
                        </div>

                        <!-- 2. Fila del Tutor 1 -->
                        <div class="fila-tabla cuerpo-tabla">
                            <div class="columna texto-resaltado">Introducción a Java</div>
                            <div class="columna">Carlos Mendoza</div>
                            <div class="columna">Programación</div>
                            <div class="columna">$25.000/h</div>
                            <div class="columna"><span class="etiqueta-estado estado-activo">Activo</span></div>
                            <div class="columna acciones-iconos">
                                <button class="btn-accion-editar" title="Editar">editar<i data-lucide="pencil"></i></button>
                                <button class="btn-accion-eliminar" title="Eliminar">Eliminar<i
                                        data-lucide="trash-2"></i></button>
                            </div>
                        </div>

                        <!-- 3. Fila del Tutor 2 -->
                        <div class="fila-tabla cuerpo-tabla">
                            <div class="columna texto-resaltado"></div>
                            <div class="columna"></div>
                            <div class="columna"></div>
                            <div class="columna"></div>
                            <div class="columna"><span class="etiqueta-estado estado-pendiente"></span></div>
                            <div class="columna acciones-iconos">
                                <button class="btn-accion-editar" title="Editar"><i data-lucide="pencil"></i></button>
                                <button class="btn-accion-eliminar" title="Eliminar"><i
                                        data-lucide="trash-2"></i></button>
                            </div>
                        </div>


                    </div>

                    <!-- Fin tabla falsa -->

                </section>

            </main>
        </div>

    </div>

    <!-- Inicializador de Iconos -->
    
    <script src="https://unpkg.com">
        lucide.createIcons();
    </script>
    <script src="../../js/auth.js"></script> 
    <script src="./dashboard-admin.js"></script>

</body>

</html>
